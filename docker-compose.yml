name: securetalk

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?definir en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      DB_DATABASE: ${POSTGRES_DB:?definir en .env}
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      INTERNAL_TLS_CERT_PATH: /run/keys/auth.crt
      INTERNAL_TLS_KEY_PATH: /run/keys/auth.key
    volumes:
      - type: bind
        source: ./keys/jwt_private.pem
        target: /run/keys/jwt_private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./keys/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./keys/internal/auth.crt
        target: /run/keys/auth.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./keys/internal/auth.key
        target: /run/keys/auth.key
        read_only: true
        bind:
          create_host_path: false
    # El puerto HTTPS interno no se publica: solo STEGO lo alcanza por la red services.
    ports:
      - '127.0.0.1:${AUTH_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth_db
      - services

  stego-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STEGO_POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${STEGO_POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${STEGO_POSTGRES_DB:?definir en .env}
    volumes:
      - stego_db_data:/var/lib/postgresql/data
    networks:
      - stego_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  stego-service:
    build: ./stego-service
    restart: unless-stopped
    env_file:
      - ./stego-service/.env
    environment:
      PORT: 3002
      DB_HOST: stego-db
      DB_PORT: 5432
      DB_USERNAME: ${STEGO_POSTGRES_USER:?definir en .env}
      DB_PASSWORD: ${STEGO_POSTGRES_PASSWORD:?definir en .env}
      DB_DATABASE: ${STEGO_POSTGRES_DB:?definir en .env}
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      # HTTPS con el certificado de AUTH: la clave de servicio y el JWT no viajan en claro.
      AUTH_BASE_URL: https://auth-service:3443
      NODE_EXTRA_CA_CERTS: /run/keys/auth.crt
      UPLOAD_DIR: /app/data/uploads
      QUARANTINE_DIR: /app/data/quarantine
    depends_on:
      stego-db:
        condition: service_healthy
    volumes:
      - stego_data:/app/data
      # STEGO solo recibe el certificado, nunca su llave privada.
      - type: bind
        source: ./keys/internal/auth.crt
        target: /run/keys/auth.crt
        read_only: true
        bind:
          create_host_path: false
      # STEGO solo recibe la llave publica.
      - type: bind
        source: ./keys/jwt_public.pem
        target: /run/keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:${STEGO_PORT:-3002}:3002'
    networks:
      - stego_db
      - services

networks:
  # Solo auth-service y postgres: STEGO no puede alcanzar la base de datos.
  auth_db:
    internal: true
  # Solo stego-service y stego-db: AUTH no puede alcanzar la base de STEGO.
  stego_db:
    internal: true
  services:

volumes:
  postgres_data:
  stego_db_data:
  stego_data:
